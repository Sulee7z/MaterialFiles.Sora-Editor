name: MaterialFiles ci

on:
  workflow_dispatch:
  push:
    branches: [Sora-Editor_1.7, main]
    tags: ['*']

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      STORE_FILE: key.jks
      STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Delete Non-Free Code
        run: |
          rm -rf app/src/main/java/me/zhanghai/android/files/nonfree
          find app/src -type f -exec sed -i '/\/\/#ifdef NONFREE/,/\/\/#endif/d' {} +

      - name: Write Signing Configuration
        run: |
          if [ -n "${{ secrets.KEY_STORE }}" ]; then
            printf '%s' "${{ secrets.KEY_STORE }}" | tr -d '[:space:]' | base64 --decode > key.jks
            if [ ! -s key.jks ]; then echo "::error::Failed to decode KEY_STORE secret"; exit 1; fi
            echo "Signing keystore written; credentials passed via environment"
          else
            echo "No signing secrets configured, falling back to debug signing"
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' app/build.gradle
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # The project compiles with Java 25 source/target compatibility
          # (app/build.gradle compileOptions), matching Sora-Editor.yml.
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew assembleRelease --parallel --stacktrace

      - name: Get version and short SHA
        id: get_tag
        run: |
          # Same single-source-of-truth version as Sora-Editor.yml: version.properties.
          major=$(grep -Po '^versionMajor=\K[0-9]+' version.properties)
          minor=$(grep -Po '^versionMinor=\K[0-9]+' version.properties)
          patch=$(grep -Po '^versionPatch=\K[0-9]+' version.properties)
          if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
            tag='1.8.4'
          else
            tag="$major.$minor.$patch"
          fi
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "Short_SHA=$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_OUTPUT

      - name: Rename artifact
        id: rename
        working-directory: app/build/outputs/apk/release/
        run: |
          APK=$(ls app-release*.apk)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="MaterialFiles.Sora-Editor-$GITHUB_REF_NAME.apk"
          else
            NAME="MaterialFiles.Sora-Editor-${{ steps.get_tag.outputs.tag }}@${{ steps.get_tag.outputs.Short_SHA }}.apk"
          fi
          mv "$APK" "$NAME"
          echo "apk_name=$NAME" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialFiles-release ${{ steps.get_tag.outputs.tag }}@${{ steps.get_tag.outputs.Short_SHA }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 28
